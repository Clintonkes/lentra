name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the site be rebuilt from the Actions tab, e.g. right after a custom
  # domain is added or VITE_API_URL is changed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # Without it the quote and contact forms would have no backend to post to.
      - name: Check VITE_API_URL is set
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Set the repo variable VITE_API_URL (Settings > Secrets and variables > Actions > Variables) to the Render backend URL."
            exit 1
          fi
      # base_path is "/<repo>" on the default github.io URL and "" once a
      # custom domain is set, so the same build command serves both.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
