<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Decodes the path public/404.html encoded before redirecting here,
      // restoring the real URL so React Router mounts on the right route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1835" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Petraslynn LLC | Premier Lawn Care in Aurora, CO</title>
    <meta name="description" content="Petraslynn LLC — Professional lawncare and landscaping services in Aurora, CO. Lawn mowing, hedge trimming, yard cleanup, irrigation, landscape design, and turf care." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Petraslynn LLC" />
    <meta property="og:title" content="Petraslynn LLC | Premier Lawn Care in Aurora, CO" />
    <meta property="og:description" content="Professional lawn care and landscaping in Aurora and the Denver metro area. Free estimates." />
    <meta name="twitter:card" content="summary" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
